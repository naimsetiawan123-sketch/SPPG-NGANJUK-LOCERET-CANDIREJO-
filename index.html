<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu MBG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f7f2;font-family:Arial,sans-serif;color:#222}
header{background:#2e7d32;color:#fff;text-align:center;padding:28px 16px;border-radius:0 0 24px 24px}
h1{margin:0 0 6px}.wrap{max-width:650px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 16px #0001}
.date{text-align:center;color:#666;margin:5px 0 18px}.item{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.item:last-child{border:0}
.name{font-weight:700}.desc{font-size:13px;color:#777;margin-top:4px}.price{color:#2e7d32;font-weight:bold;white-space:nowrap}
.notice{background:#fff8df;border-left:5px solid #ff9800;padding:13px;border-radius:9px;font-size:14px;line-height:1.5}
.small{text-align:center;color:#777;font-size:12px;padding:18px}.admin{display:block;text-align:center;margin:15px;color:#2e7d32}
</style></head>
<body>
<header><h1>🍱 MENU MBG</h1><div>Program Makan Bergizi Gratis</div></header>
<div class="wrap">
<div class="card"><h2 style="text-align:center">Menu Hari Ini</h2><div id="date" class="date"></div><div id="menu"></div></div>
<div class="card"><h3>ℹ️ Informasi</h3><div class="notice"><b>Dilarang membawa pulang makanan MBG.</b><br>Batas waktu konsumsi makanan adalah 2 jam setelah pengiriman.</div></div>
<div class="card"><b>SPPG Nganjuk Loceret Candirejo</b><br><span>Yayasan Darul Falah Baron</span></div>
<div class="small">Menu dapat diperbarui melalui halaman admin.</div>
<a class="admin" href="admin.html">⚙️ Admin Menu</a>
</div>
<script>
const fallback={tanggal:"",menu:[
{name:"Nasi Putih",desc:"Porsi sesuai ketentuan",harga:""},
{name:"Lauk Utama",desc:"Menu lauk hari ini",harga:""},
{name:"Sayur",desc:"Sayuran segar",harga:""},
{name:"Buah",desc:"Buah sesuai menu",harga:""}]};
let data;try{data=JSON.parse(localStorage.getItem("menuMBG"))||fallback}catch(e){data=fallback}
document.getElementById("date").textContent=data.tanggal||new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
document.getElementById("menu").innerHTML=data.menu.map(x=>`<div class="item"><div><div class="name">${esc(x.name)}</div><div class="desc">${esc(x.desc)}</div></div><div class="price">${esc(x.harga)}</div></div>`).join("");
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script></body></html>
